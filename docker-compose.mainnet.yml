version: '3.8'

services:
  aincore-node:
    image: aincore:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aincore-validator-1
    restart: always
    ports:
      - "9102:9102" # libp2p: consensus + sync sessions (base port + 100)
      - "8002:8002" # API
    volumes:
      - ./aincore_data:/root/.aincore/data
      - ${AINCORE_GENESIS_FILE:?set AINCORE_GENESIS_FILE to the genesis.json of the chain this node joins}:/root/.aincore/genesis.json:ro
    environment:
      - AINCORE_PORT=9002
      - AINCORE_API_PORT=8002
      # B269: reachable from the published port and the indexer.
      - AINCORE_RPC_BIND=0.0.0.0
      - RUST_LOG=info
    command: [ "node", "--port", "9002" ]
    networks:
      - aincore-net

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus
    container_name: aincore-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      # Unauthenticated: this host only.
      - "127.0.0.1:19090:9090"
    networks:
      - aincore-net

  # Indexer Service
  aincore-indexer:
    image: aincore:latest
    container_name: aincore-indexer
    command: [ "indexer" ]
    volumes:
      - ./aincore_data/indexer:/root/.aincore
    environment:
      - NODE_RPC_URL=http://aincore-node:8002/rpc
      - RUST_LOG=info
    ports:
      - "3001:3001"
    depends_on:
      - aincore-node
    networks:
      - aincore-net


networks:
  aincore-net:
    driver: bridge
