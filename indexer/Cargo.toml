[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.29", features = ["bundled"] }
actix-web = "4"
actix-cors = "0.6"
hex = "0.4"
env_logger = "0.10"
log = "0.4"
sha2 = "0.10"
bcs = "0.1.3"
vm_move = { path = "../core/vm_move" }
move-core-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
