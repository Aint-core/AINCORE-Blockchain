[package]
name = "da_sequencer"
version = "0.1.0"
edition = "2021"

[dependencies]
storage = { path = "../common/storage" }
network = { path = "../common/network" }
crypto = { path = "../common/crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.21"
tokio = { version = "1.0", features = ["full"] }
ed25519-dalek = "2.0"

# Sovereign DA dependencies
zstd = "0.13"
reed-solomon-erasure = "6.0"
rand = "0.8"