[package]
name = "da"
version = "0.2.0"
edition = "2021"

# Data availability commitments for block bodies (bug ledger B1). Kept free of
# node dependencies so a light client can verify samples with this crate alone.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
reed-solomon-erasure = "6.0"

[dev-dependencies]
serde_json = "1.0"
