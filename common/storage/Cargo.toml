[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[dependencies]
rocksdb = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# H-07: needed by save_block_json to hash and hex-encode transaction
# strings into `tx_index:{tx_hash}` entries atomically with the block.
sha2 = "0.10"
hex = "0.4"

