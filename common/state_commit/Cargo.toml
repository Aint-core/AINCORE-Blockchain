[package]
name = "state_commit"
version = "0.1.0"
edition = "2021"
description = "G3 state commitment: a Jellyfish Merkle Tree over consensus-state keys"

[dependencies]
storage = { path = "../storage" }
# Pinned exactly: P1-P9 in the G3 contract were measured on 0.12.0.
jmt = { version = "=0.12.0", default-features = false, features = ["std", "sha2"] }
sha2 = "0.10"
hex = "0.4"
borsh = "1"
anyhow = "1"
# G3 PF: the wire proof format and its database-free verifier.
state_proof = { path = "../state_proof" }

[dev-dependencies]
# G3 WG-1: test fixtures seed their own genesis state (StateDB::seeding).
storage = { path = "../storage", features = ["test-seeding"] }
rand = "0.8"
serde_json = "1.0"
