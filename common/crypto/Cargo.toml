[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2.0"
hex = "0.4"
# Human-readable `A1n…` addresses (Base58Check); already in the tree via libp2p.
bs58 = "0.5"
secp256k1 = { version = "0.29", features = ["rand", "recovery"] }
rand = "0.8"
blake3 = "1.5"

# Post-quantum transaction signatures: ML-DSA-65 (FIPS 204), B8. Pinned
# exactly: the verifier is consensus-critical, so a bump is a consensus change
# (see src/tx_sig.rs).
aws-lc-rs = "=1.18.1"

# BLS12-381 via blst (Supranational) — Audited, used by Ethereum 2.0
# Replaces bls12_381 crate which was used incorrectly as symmetric MAC
blst = "0.3"

# Zero-Knowledge Proofs (zk-SNARKs)
ark-snark = "0.4"
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"

# Zero-Knowledge Proofs (zk-STARKs)
# STARK dependencies (winterfell)
winterfell = "0.9"
# Note: winterfell includes its own math utilities
# Full STARK implementation in progress - Phase 1

# Advanced Privacy (Phase 3)
# FHE: ElGamal on BLS12-381 G1 (native implementation in mpc/mod.rs)
# tfhe crate removed: unused in source and aarch64-specific

# Randomness & Consensus (Phase 4)
# VDF implementation - using simple hash-based approach
sha3 = "0.10"

# Transport Security (Phase 3)
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zeroize = "1.7"

# Threshold Signatures (Phase 4)
# FROST: Implemented in threshold/frost.rs (using secp256k1)

# Aggregate Signatures (Phase 5)
# BLS: Implemented in bls/mod.rs (using bls12_381)

[dev-dependencies]
criterion = "0.5"
# An independent ML-DSA implementation, to cross-check aws-lc-rs.
ml-dsa = "=0.1.1"

[[bench]]
name = "stark_bench"
harness = false
