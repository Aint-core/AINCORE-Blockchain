[package]
name = "btc-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
anyhow = "1.0"
# Phase 5B.5 / SEC-N02: secure keystore loading (no env-var keys).
keystore = { path = "../../common/keystore" }
rpassword = "7"
log = "0.4"
env_logger = "0.10"
# Using a simpler hex/json approach for bridge to avoid heavy bitcoin lib dependency for just monitoring
