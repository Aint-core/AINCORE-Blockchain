[package]
name = "bridge-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
ethers = { version = "2.0", features = ["ws", "rustls"] }
dotenv = "0.15"
hex = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
keystore = { path = "../../common/keystore" }
crypto = { path = "../../common/crypto" }
# SEC-#18 Tier-B: client-side QC verification (verify_qc / ValidatorInfo /
# QuorumCertificate) so the bridge does NOT trust the RPC node's `verified` flag.
consensus = { path = "../../consensus/consensus" }
# audit #3: recompute the block hash from (header, tx_hash(transactions)) with the
# node's OWN canonical hashing so the QC-attested hash binds the transaction list.
blockchain = { path = "../../consensus/blockchain" }
rpassword = "7.0"
rand = "0.8"
