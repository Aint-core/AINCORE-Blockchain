# ============================================================
# AINCORE Blockchain — TerraMaster F2-423 NAS Deployment
# ============================================================
# Hardware: Intel Celeron N4505 (2C/2T), 4GB DDR4, 2x SATA Bay
# 
# Usage:
#   docker compose -f docker-compose.nas.yml up -d --build
#   docker compose -f docker-compose.nas.yml logs -f aincore-node
#   docker compose -f docker-compose.nas.yml down
# ============================================================

services:
  # ──────────────────────────────────────────────
  # Core Validator Node
  # ──────────────────────────────────────────────
  aincore-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: aincore:latest
    container_name: aincore-validator
    restart: unless-stopped
    ports:
      # B304: IPv4 only. Docker's userland proxy hands every IPv6 client of a
      # published port to the container from the bridge gateway, one address
      # for all, and the node's admission (handshakes, identities, sync and
      # RPC budgets) is per address. For IPv6, run the node with
      # network_mode: host.
      - "0.0.0.0:9102:9102"   # libp2p: consensus + sync sessions (base port + 100)
      - "0.0.0.0:8002:8002"   # REST API / RPC
    volumes:
      - ./nas_data:/root/.aincore/data
      - ${AINCORE_GENESIS_FILE:?set AINCORE_GENESIS_FILE to the genesis.json of the chain this node joins}:/root/.aincore/genesis.json:ro
    environment:
      - AINCORE_PORT=9002
      - AINCORE_API_PORT=8002
      # B269: reachable from the published port and the indexer.
      - AINCORE_RPC_BIND=0.0.0.0
      - AINCORE_GENESIS_PATH=/root/.aincore/genesis.json
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    command: ["node", "--port", "9002", "--rpc-port", "8002", "--datadir", "/root/.aincore/data"]
    # NAS Resource Limits (F2-423: 2 cores, 4GB RAM)
    deploy:
      resources:
        limits:
          cpus: "1.5"        # Leave 0.5 core for TOS + system
          memory: 2560M      # 2.5GB — leave 1.5GB for TOS/indexer/OS
        reservations:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - aincore-net

  # ──────────────────────────────────────────────
  # Indexer (Block Explorer Backend)
  # ──────────────────────────────────────────────
  aincore-indexer:
    image: aincore:latest
    container_name: aincore-indexer
    restart: unless-stopped
    command: ["indexer"]
    volumes:
      - ./nas_data/indexer:/root/.aincore
    environment:
      - NODE_RPC_URL=http://aincore-node:8002/rpc
      - RUST_LOG=info
    ports:
      - "0.0.0.0:3001:3001"   # Indexer API
    depends_on:
      - aincore-node
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - aincore-net

  # No Watchtower: it held the Docker socket and replaced every container on
  # this validator host from an unpinned `latest` image (a registry
  # compromise was root here). Update by hand, from a reviewed build.

volumes:
  aincore-data:
    driver: local

networks:
  aincore-net:
    driver: bridge
