version: '3.8'

services:
  aincore-node:
    image: aincore:testnet
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aincore-testnet-1
    restart: always
    ports:
      - "9100:9100" # libp2p: consensus + sync sessions (base port + 100)
      - "8545:8000" # API/RPC
    volumes:
      - ./testnet_data:/root/.aincore/data
      - ./genesis.json:/root/.aincore/genesis.json:ro
    environment:
      - AINCORE_PORT=9000
      - AINCORE_API_PORT=8000
      # The chain id comes from genesis.json (sys:chain_id), G3 FX-6.
      - RUST_LOG=info
    command: [ "node", "--port", "9000", "--rpc-port", "8000", "--datadir", "/root/.aincore/data", "--enable-mdns" ]
    networks:
      - aincore-testnet

networks:
  aincore-testnet:
    driver: bridge
