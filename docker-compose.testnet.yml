version: '3.8'

services:
  aincore-node:
    image: aincore:testnet
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aincore-testnet-1
    restart: always
    ports:
      # B304: IPv4 only. Docker's userland proxy hands every IPv6 client of a
      # published port to the container from the bridge gateway, one address
      # for all, and the node's admission (handshakes, identities, sync and
      # RPC budgets) is per address. For IPv6, run the node with
      # network_mode: host.
      - "0.0.0.0:9100:9100" # libp2p: consensus + sync sessions (base port + 100)
      - "0.0.0.0:8545:8002" # API/RPC (and /metrics)
    volumes:
      - ./testnet_data:/home/aincore/.aincore/data
      - ${AINCORE_GENESIS_FILE:?set AINCORE_GENESIS_FILE to the genesis.json of the chain this node joins}:/home/aincore/.aincore/genesis.json:ro
    environment:
      # The chain id comes from genesis.json (sys:chain_id), G3 FX-6.
      - RUST_LOG=info
    command: [ "node", "--port", "9000", "--rpc-port", "8002", "--datadir", "/home/aincore/.aincore/data" ]
    # B306: bounded logs.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - aincore-testnet

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus
    container_name: aincore-prometheus-testnet
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      # Unauthenticated: this host only.
      - "127.0.0.1:19090:9090"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - aincore-testnet

  # B330: no TCP tunnel for the RPC. A tunnel (the playit agent stood here)
  # delivers every client from one address, so all shared one client's rate
  # limit and heavy-call lease. Serve the public RPC through an HTTP proxy
  # that names each client in a header, on the node's proxy listener
  # (AINCORE_RPC_PROXY_BIND, with the proxy's address trusted: B303).

networks:
  aincore-testnet:
    driver: bridge
