[package]
name = "chain_sync"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
storage = { path = "../common/storage" }
network = { path = "../common/network" }
blockchain = { path = "../consensus/blockchain" }
consensus = { path = "../consensus/consensus" }
crypto = { path = "../common/crypto" }
executor = { path = "../core/executor" }
state_commit = { path = "../common/state_commit" }
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
hex = "0.4"

[dev-dependencies]
# G3 WG-1: test fixtures seed their own genesis state (StateDB::seeding).
storage = { path = "../common/storage", features = ["test-seeding"] }
# G1 S10: the system suite runs real consensus nodes with their sync.
consensus = { path = "../consensus/consensus", features = ["sim"] }
mempool = { path = "../core/mempool" }
# G3: fixtures seed the state tree the way genesis will.
state_commit = { path = "../common/state_commit" }
