[package]
name = "bench-tps"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
colored = "2.0"
indicatif = "0.17" # For progress bars
rand = "0.8"
ed25519-dalek = "2.0" # For signing transactions
hex = "0.4"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
bcs = "0.1.6"
crypto = { path = "../common/crypto" }
vm_move = { path = "../core/vm_move" }
move-core-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0", features = ["address32"] }
