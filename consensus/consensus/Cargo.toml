[package]
name = "consensus"
version = "0.1.0"
edition = "2021"

[dependencies]
storage = { path = "../../common/storage" }
network = { path = "../../common/network" }
crypto = { path = "../../common/crypto" }
executor = { path = "../../core/executor" }
mempool = { path = "../../core/mempool" }
config = { path = "../../common/config" }
blockchain = { path = "../blockchain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
bcs = "0.1"
hex = "0.4"
rayon = "1.7"
sha2 = "0.10"
# G3 GC-1: state pruning next to block pruning.
state_commit = { path = "../../common/state_commit" }
# G3 PF-2: the client check of a state proof.
state_proof = { path = "../../common/state_proof" }
# Note: Cryptography now consolidated in common/crypto
# ed25519-dalek removed - use crypto crate
# sha256 removed - use crypto crate

[features]
# G1 S10: multi-node system tests in other crates (chain_sync) route this
# node's consensus messages through an in-memory outbox. Never in a build.
sim = []

[dev-dependencies]
# G3 WG-1: test fixtures seed their own genesis state (StateDB::seeding).
storage = { path = "../../common/storage", features = ["test-seeding"] }
# B14: a cluster test executes a funded transaction end to end.
executor = { path = "../../core/executor", features = ["test-support"] }
