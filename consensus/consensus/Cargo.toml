[package]
name = "consensus"
version = "0.1.0"
edition = "2021"

[dependencies]
storage = { path = "../../common/storage" }
network = { path = "../../common/network" }
crypto = { path = "../../common/crypto" }
executor = { path = "../../core/executor" }
mempool = { path = "../../core/mempool" }
config = { path = "../../common/config" }
blockchain = { path = "../blockchain" }
da_sequencer = { path = "../../da" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
bcs = "0.1"
hex = "0.4"
rayon = "1.7"
# Note: Cryptography now consolidated in common/crypto
# ed25519-dalek removed - use crypto crate
# sha256 removed - use crypto crate