version: '3.8'

services:
  # === NODE 1 (Primary Validator) ===
  aincore-node-1:
    image: aincore:testnet
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aincore-testnet-1
    restart: always
    ports:
      - "9000:9000" # P2P
      - "8000:8000" # API/RPC
    volumes:
      - ./testnet_data_node1:/root/.aincore/data
    environment:
      - AINCORE_PORT=9000
      - AINCORE_API_PORT=8000
      - AINCORE_CHAIN_ID=AINCORE-TESTNET-1
      - RUST_LOG=info
    command:
      - "node"
      - "--port"
      - "9000"
      - "--rpc-port"
      - "8000"
      - "--datadir"
      - "/root/.aincore/data"
      - "--enable-mdns"
      - "--bootnodes"
      - "/ip4/aincore-node-2/tcp/9001"
    networks:
      - aincore-testnet
    depends_on:
      - aincore-node-2

  # === NODE 2 (Secondary Validator) ===
  aincore-node-2:
    image: aincore:testnet
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aincore-testnet-2
    restart: always
    ports:
      - "9001:9001" # P2P
      - "8001:8001" # API/RPC
    volumes:
      - ./testnet_data_node2:/root/.aincore/data
    environment:
      - AINCORE_PORT=9001
      - AINCORE_API_PORT=8001
      - AINCORE_CHAIN_ID=AINCORE-TESTNET-1
      - RUST_LOG=info
    command:
      - "node"
      - "--port"
      - "9001"
      - "--rpc-port"
      - "8001"
      - "--datadir"
      - "/root/.aincore/data"
      - "--enable-mdns"
      - "--bootnodes"
      - "/ip4/aincore-node-1/tcp/9000"
    networks:
      - aincore-testnet

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus
    container_name: aincore-prometheus-testnet
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "19090:9090"
    networks:
      - aincore-testnet

networks:
  aincore-testnet:
    driver: bridge
