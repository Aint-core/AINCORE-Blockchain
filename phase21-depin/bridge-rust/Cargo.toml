[package]
name = "bridge-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
ethers = { version = "2.0", features = ["ws", "rustls"] }
dotenv = "0.15"
hex = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
keystore = { path = "../../common/keystore" }
rpassword = "7.0"

