[package]
name = "mempool"
version = "0.1.0"
edition = "2021"

[dependencies]
network = { path = "../../common/network" }
executor = { path = "../executor" }
crypto = { path = "../../common/crypto" }
vm_move = { path = "../vm_move" }
# Phase 2.1 (H-01): mempool now performs full Dilithium5 verification
# instead of only fail-closing the path. Needs storage to look up the
# canonical `pqc_pubkey_{sender}` binding, and pqcrypto-dilithium to
# do the actual verify.
storage = { path = "../../common/storage" }
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
hex = "0.4"
sha2 = "0.10"
serde_json = "1.0"
ed25519-dalek = "2.0"
bcs = "0.1"

[dev-dependencies]
# SEC-#27 admission-balance tests: build the exact CoinStore key the executor
# reads, so the gate's reject path can be exercised end-to-end. Same git source
# vm_move already pins (resolved in the workspace lockfile).
move-core-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
