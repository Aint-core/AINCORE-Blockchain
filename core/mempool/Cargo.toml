[package]
name = "mempool"
version = "0.1.0"
edition = "2021"

[dependencies]
network = { path = "../../common/network" }
executor = { path = "../executor" }
# G3 FX-6: the one chain-id accessor.
blockchain = { path = "../../consensus/blockchain" }
crypto = { path = "../../common/crypto" }
vm_move = { path = "../vm_move" }
# The admission balance gate reads committed state.
storage = { path = "../../common/storage" }
hex = "0.4"
sha2 = "0.10"
serde_json = "1.0"
ed25519-dalek = "2.0"
bcs = "0.1"

[dev-dependencies]
# B16 tests seed an account's sequence number.
executor = { path = "../executor", features = ["test-support"] }
# G3 WG-1: test fixtures seed their own genesis state (StateDB::seeding).
storage = { path = "../../common/storage", features = ["test-seeding"] }
# SEC-#27 admission-balance tests: build the exact CoinStore key the executor
# reads, so the gate's reject path can be exercised end-to-end. Same git source
# vm_move already pins (resolved in the workspace lockfile).
move-core-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0", features = ["address32"] }
