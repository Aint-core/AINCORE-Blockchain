[package]
name = "node"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Core modules ---
executor = { path = "../executor" }
mempool = { path = "../mempool" }
vm_move = { path = "../vm_move" }
storage = { path = "../../common/storage" }
# G3 RC-1: boot consistency of the state tree.
state_commit = { path = "../../common/state_commit" }
network = { path = "../../common/network" }
config = { path = "../../common/config" }
crypto = { path = "../../common/crypto" }

# --- Consensus & Blockchain ---
consensus = { path = "../../consensus/consensus" }
blockchain = { path = "../../consensus/blockchain" }
account = { path = "../../consensus/account" }
chain_sync = { path = "../../sync" }

# --- Data Availability ---
da = { path = "../../da" }


# --- Governance ---
governance = { path = "../../governance/governance" }

# --- Utility & Frameworks ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

hex = "0.4"
rand = "0.8"
aa = { path = "../../consensus/aa" }
move-binary-format = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
move-core-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0", features = ["address32"] }
bcs = "0.1"



# --- Async & Web API ---
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.6"
actix-governor = "0.4"
rocksdb = "0.21.0"

# --- P2P Layer ---
libp2p = { version = "0.54", features = [
    "tcp",
    "yamux",
    "noise",
    "gossipsub",
    "mdns",
    "identify",
    "kad",
    "tokio",
    "dns",
    "macros",
    "autonat",
    "dcutr",
    "relay",
    # G4 S1: committee sessions (`sessions.rs`).
    "request-response"
] }
async-trait = "0.1"
futures = "0.3"
prometheus = "0.13"
lazy_static = "1.4"

[dev-dependencies]
# G3 WG-1: test fixtures seed their own genesis state (StateDB::seeding).
storage = { path = "../../common/storage", features = ["test-seeding"] }
# G3 PF: tests verify the proof RPC with the client verifier.
state_proof = { path = "../../common/state_proof" }
