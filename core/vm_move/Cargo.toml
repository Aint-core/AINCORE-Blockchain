[package]
name = "vm_move"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
move-binary-format = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
move-core-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
move-vm-runtime = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
move-vm-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
serde = { version = "1.0", features = ["derive"] }
storage = { path = "../../common/storage" }
hex = "0.4"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"
serde_json = "1.0"
ed25519-dalek = "2.0"

[dev-dependencies]
rand = "0.8"
sha2 = "0.10"
