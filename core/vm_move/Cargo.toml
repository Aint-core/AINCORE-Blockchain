[package]
name = "vm_move"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
move-binary-format = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
move-core-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0", features = ["address32"] }
move-vm-runtime = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
# B69: the verifier limits the VM runs with.
move-bytecode-verifier = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
move-vm-types = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
serde = { version = "1.0", features = ["derive"] }
storage = { path = "../../common/storage" }
hex = "0.4"
bcs = "0.1"
serde_json = "1.0"
ed25519-dalek = "2.0"
move-stdlib = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0", version = "0.1.1" }

[dev-dependencies]
# G3 WG-1: test fixtures seed their own genesis state (StateDB::seeding).
storage = { path = "../../common/storage", features = ["test-seeding"] }
# Compiles the Move unit tests under stdlib/tests (see src/move_unit_tests.rs).
move-compiler = { git = "https://github.com/move-language/move", branch = "aptos-v1.3.0" }
rand = "0.8"
sha2 = "0.10"
